name: Android Maestro

on:
  pull_request:
  push:
    branches:
      - main

# Superseded runs on the same ref are wasted emulator minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Replaces setup-java's `cache: gradle`. This is what the android-emulator-runner
      # README recommends, and it caches configuration cache + dependencies properly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew is committed with mode 100644, so it is not executable after checkout.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Verify Maestro installation
        run: maestro --version

      # Required for hardware-accelerated virtualisation on Linux runners.
      # Snippet is verbatim from the android-emulator-runner README.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # --- AVD snapshot caching (android-emulator-runner README pattern) -------------
      # Booting a cold AVD costs minutes on every run. Cache the created AVD and reuse
      # its snapshot, so subsequent runs boot from a warm snapshot instead.
      - name: AVD cache
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-google_apis-x86_64-pixel_6

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for caching"

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          # -no-snapshot-save keeps the cached snapshot pristine across runs.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # NOTE: deliberately no `set -e`. The previous version used `set -eu` with
            # `maestro ... > maestro.log` followed by `cat`, so a failing test aborted
            # the script *before* the cat and the console showed nothing but
            # "The process '/usr/bin/sh' failed with exit code 1". Here the exit status
            # is captured explicitly and every diagnostic is emitted before exiting.
            set -o pipefail

            mkdir -p maestro-artifacts/logs \
                     maestro-artifacts/reports \
                     maestro-artifacts/debug \
                     maestro-artifacts/test-output

            adb wait-for-device

            # -d allows reinstalling over a newer already-installed build.
            adb install -r -d app/build/outputs/apk/debug/app-debug.apk

            adb logcat -c

            # Only flows tagged `ci` run here. The other flows require a Firebase phone
            # sign-in (SMS OTP), which a clean CI emulator cannot satisfy.
            #   --test-output-dir : screenshots + video (NOT included in --debug-output)
            #   --debug-output    : maestro.log + commands JSON
            #   --flatten-debug-output : no per-run timestamped subfolders, per docs
            #   --no-ansi         : keeps escape codes out of the CI log and artifacts
            status=0
            maestro test .maestro \
              --include-tags ci \
              --format junit \
              --output maestro-artifacts/reports/maestro-report.xml \
              --test-output-dir maestro-artifacts/test-output \
              --debug-output maestro-artifacts/debug \
              --flatten-debug-output \
              --no-ansi 2>&1 | tee maestro-artifacts/logs/maestro.log || status=$?

            # Dump the ring buffer regardless of outcome so crashes/ANRs are triageable.
            adb logcat -d > maestro-artifacts/logs/logcat.txt 2>&1 || true

            exit "$status"

      # No hashFiles() guard: the old `if: always() && hashFiles(...) != ''` meant an
      # early failure (before any file existed) skipped the upload entirely, leaving no
      # diagnostics at all. `warn` keeps the job's real failure as the reported one.
      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-artifacts
          if-no-files-found: warn
          retention-days: 14
          path: maestro-artifacts/**
