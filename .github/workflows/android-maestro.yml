name: Android Maestro

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  android-maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Checkout repository source
      - name: Checkout
        uses: actions/checkout@v4

      # Java 17 matches the project's Android/Kotlin toolchain
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Ensure the Gradle wrapper can execute on Linux runners
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build the debug APK for the single :app module
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      # Install latest Maestro CLI and expose it on PATH for later steps
      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Verify Maestro is correctly installed before starting emulator tests
      - name: Verify Maestro installation
        run: maestro --version

      # Start Android emulator, install APK, and run all Maestro flows
      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eo pipefail
            adb wait-for-device
            until [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; do
              sleep 5
            done

            adb install -r app/build/outputs/apk/debug/app-debug.apk

            mkdir -p maestro-artifacts
            maestro test .maestro \
              --format junit \
              --output maestro-artifacts/maestro-report.xml \
              --debug-output maestro-artifacts/debug \
              2>&1 | tee maestro-artifacts/maestro.log

      # Collect screenshots/logs/debug artifacts when Maestro or emulator steps fail
      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-failure-artifacts
          if-no-files-found: warn
          path: |
            maestro-artifacts/**
            .maestro/**/screenshots/**
            app/build/reports/**
